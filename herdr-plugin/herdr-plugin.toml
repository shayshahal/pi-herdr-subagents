id = "pi-herdr-subagents"
name = "Pi Herdr Subagents"
version = "0.2.0"
# v0.8.2 is the first known-good release with split plugin panes.
min_herdr_version = "0.8.2"
description = "Launch pi subagents in Herdr panes"
platforms = ["linux", "macos", "windows"]

[[panes]]
id = "subagent"
title = "Pi subagent"
placement = "split"
command = ["node", "-e", "require(process.env.HERDR_PLUGIN_ROOT + '/dispatch.cjs')"]

[[panes]]
id = "argv"
title = "Command"
placement = "split"
command = ["node", "-e", "require(process.env.HERDR_PLUGIN_ROOT + '/dispatch.cjs')"]
